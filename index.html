<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ege Gizemi - Açık Dünya & Sorgu Sistemi</title>
<style>
:root {
--bg-color: #0c0f0e;
--container-bg: #131a16;
--border-color: #243328;
--accent-green: #34d399;
--accent-gold: #fbbf24;
--text-main: #e2e8f0;
--text-muted: #94a3b8;
--btn-bg: #1c2820;
--btn-hover: #293b2f;
}
body {
margin: 0;
background: var(--bg-color);
color: var(--text-main);
font-family: 'Georgia', serif;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
min-height: 100vh;
padding: 15px;
box-sizing: border-box;
}
.game-container {
width: 100%;
max-width: 650px;
background: var(--container-bg);
border: 2px solid var(--border-color);
border-radius: 16px;
box-shadow: 0 25px 60px rgba(0,0,0,0.85);
overflow: hidden;
display: flex;
flex-direction: column;
position: relative;
}
.top-panel {
background: #17211b;
border-bottom: 1px solid var(--border-color);
display: flex;
flex-direction: column;
}
.status-bar {
padding: 12px 20px;
display: flex;
justify-content: space-between;
font-size: 11px;
font-family: 'Segoe UI', Tahoma, sans-serif;
font-weight: bold;
color: var(--accent-green);
letter-spacing: 1.5px;
text-transform: uppercase;
}
.audio-controls {
padding: 8px 20px;
background: #0f1411;
display: flex;
justify-content: space-between;
align-items: center;
font-size: 12px;
font-family: 'Segoe UI', Tahoma, sans-serif;
border-top: 1px solid #1f2b23;
}
.audio-btn {
background: #243328;
color: var(--accent-green);
border: 1px solid var(--accent-green);
padding: 4px 10px;
border-radius: 4px;
cursor: pointer;
font-size: 11px;
font-weight: bold;
transition: all 0.2s;
}
.audio-btn:hover {
background: var(--accent-green);
color: #0c0f0e;
}
.inventory-bar {
background: #0a0e0b;
padding: 10px 20px;
font-size: 12px;
color: var(--accent-gold);
border-bottom: 1px solid var(--border-color);
font-family: monospace;
letter-spacing: 0.5px;
}
.screen-area {
padding: 30px;
min-height: 240px;
display: flex;
align-items: center;
justify-content: center;
text-align: justify;
font-size: 16px;
line-height: 1.95;
color: #f1f5f9;
border-bottom: 1px solid var(--border-color);
background: radial-gradient(circle, #18231c 0%, #131a16 100%);
}
.choices-area {
padding: 20px;
display: flex;
flex-direction: column;
gap: 12px;
background: #0f1411;
}
.choice-btn {
background: var(--btn-bg);
color: var(--text-main);
border: 1px solid #2d3d32;
padding: 15px 18px;
border-radius: 10px;
cursor: pointer;
text-align: left;
font-size: 14px;
font-family: 'Segoe UI', Tahoma, sans-serif;
transition: all 0.25s ease;
box-shadow: 0 4px 6px rgba(0,0,0,0.2);
}
.choice-btn:hover {
background: var(--btn-hover);
border-color: var(--accent-green);
transform: translateY(-2px);
box-shadow: 0 6px 12px rgba(52,211,153,0.15);
}
</style>
</head>
<body>
<div class="game-container">
<div class="top-panel">
<div class="status-bar">
<span id="chapterTitle">BÖLÜM 1: SERBEST KEŞİF</span>
<span id="tensionMeter">ATMOSFER: GİZEMLİ</span>
</div>
<div class="audio-controls">
<span id="audioStatus">🔊 Seslendirme: Hazır</span>
<div>
<button class="audio-btn" onclick="togglePauseSpeech()">Durdur / Devam Et</button>
<button class="audio-btn" onclick="replaySpeech()">Tekrar Dinle</button>
</div>
</div>
</div>
<div class="inventory-bar" id="inventoryBar">ÇANTAN: [ Boş ]</div>
<div class="screen-area" id="storyText">
Hikaye yükleniyor...
</div>
<div class="choices-area" id="choicesArea"></div>
</div>
<script>
let inventory = [];
let currentText = "";
let isPaused = false;
// Sorgu Takip Sistemi (Karakterlerin sırları)
let interrogationState = {
muhtar: { talked: false, suspicious: false },
terzi: { talked: false, confessed: false },
hakim: { talked: false, nervous: false }
};
function speakText(text) {
currentText = text;
if ('speechSynthesis' in window) {
window.speechSynthesis.cancel();
let utterance = new SpeechSynthesisUtterance(text);
utterance.lang = 'tr-TR';
utterance.rate = 0.92;
utterance.pitch = 0.85;
utterance.onstart = () => { document.getElementById("audioStatus").innerText = "🔊 Seslendirme: Çalıyor..."; };
utterance.onend = () => { document.getElementById("audioStatus").innerText = "🔈 Seslendirme: Tamamlandı"; };
window.speechSynthesis.speak(utterance);
}
}
function togglePauseSpeech() {
if ('speechSynthesis' in window) {
if (window.speechSynthesis.speaking) {
if (isPaused) {
window.speechSynthesis.resume();
isPaused = false;
document.getElementById("audioStatus").innerText = "🔊 Seslendirme: Çalıyor...";
} else {
window.speechSynthesis.pause();
isPaused = true;
document.getElementById("audioStatus").innerText = "⏸️ Seslendirme: Duraklatıldı";
}
}
}
}
function replaySpeech() {
if (currentText) {
isPaused = false;
speakText(currentText);
}
}
const gameData = {
start: {
title: "BÖLÜM 1: KASABAYA GİRİŞ",
tension: "SERBEST KEŞİF",
text: "İzmir'in tarihi taş evleri, dar sokakları ve zeytin kokulu rüzgarıyla ünlü bu kasabasına resmi dedektif kimliğinle adım attın. Deden Ruhan Tonguç’un ölümü resmi raporlarda kalp krizi geçse de, içinde bunun bir cinayet olduğuna dair güçlü şüpheler var. Artık kasabada serbestsin; istersen ipucu aramak için dedenin evine gidebilir, istersen mahalle esnafını ve yetkilileri sorguya çekebilirsin.",
action: () => { inventory = []; },
choices: [
{ text: "🏠 Dedenin Eski Evine Git (Delil Ara)", next: "olay_yeri" },
{ text: "☕ Kasaba Meydanı / Kahvehaneye Git (Muhtarla Konuş)", next: "muhtar_sorgu_menu" },
{ text: "🧵 Çarşıdaki Terziye Git (Şüpheli Kol Düğmesini Sor)", next: "terzi_sorgu_menu" },
{ text: "⚖️ Adliye / Hakimlik Binasına Git (Hakimle Yüzleş)", next: "hakim_sorgu_menu" },
{ text: "🏭 Eski Zeytinyağı Fabrikasına Git", next: "fabrika_gece" }
]
},
olay_yeri: {
title: "MEKAN: DEDENİN EVİ",
tension: "ADLİ İNCELEME",
text: "Dedenin taş evindesin. Pencerelerden sızan tozlu ışık altında evi didik didik arıyorsun. Çalışma masasında dedenin son notları ve yerdeki halının altında gizli bir bölme buldun.",
action: () => {
if(!inventory.includes("Polis Not Defteri")) inventory.push("Polis Not Defteri");
if(!inventory.includes("Gümüş Kol Düğmesi")) inventory.push("Gümüş Kol Düğmesi");
},
choices: [
{ text: "📜 Not Defterini incele (Müftü Cinayeti bağlantısını gör)", next: "not_detay" },
{ text: "🗺️ Kasaba Merkezine Geri Dön", next: "start" }
]
},
not_detay: {
title: "DELİL İnceLEMESİ",
tension: "BÜYÜK KEŞİF",
text: "Not defterinde, yıllar önceki 'Müftü Cinayeti' ile dedenin zehirlenmesi arasında doğrudan bir bağ olduğu yazıyor. Katilin kasabada hala elini kolunu sallayarak gezen üst düzey bir yetkili olduğunu öğreniyorsun.",
action: () => {
if(!inventory.includes("Dosya Bağlantısı")) inventory.push("Dosya Bağlantısı");
},
choices: [
{ text: "Kasaba Meydanına Dön ve Şüphelileri Sorgula", next: "start" }
]
},
muhtar_sorgu_menu: {
title: "SORGU: MUHTAR İSMAİL",
tension: "GERGİN DİYALOG",
text: "Muhtar İsmail, çay ocağının önünde seni görünce hafifçe geriliyor. 'Buyur dedektif bey, kasabamız sakindir, ne arıyorsun burada?' diye soruyor.",
action: () => { interrogationState.muhtar.talked = true; },
choices: [
{ text: "🗣️ Sorgula: 'Dedenin ölüm gecesi neredeydin?'", next: "muhtar_cevap_1" },
{ text: "🗣️ Sorgula: 'Yıllar önceki Müftü cinayeti hakkında ne biliyorsun?'", next: "muhtar_cevap_2" },
{ text: "🔙 Kasaba Merkezine Dön", next: "start" }
]
},
muhtar_cevap_1: {
title: "MUHTARIN İTİRAFI",
tension: "ŞÜPHELİ TAVIRLAR",
text: "Muhtar çay bardağını sertçe masaya bırakıyor: 'O gece evimde uyuyordum! Ruhan hoca çok fazla şey biliyordu, herkesin kuyusunu kazıyordu. Hakim efendiye sorarsan o da bilir!'",
action: () => { interrogationState.muhtar.suspicious = true; },
choices: [{ text: "Devam Et", next: "muhtar_sorgu_menu" }]
},
muhtar_cevap_2: {
title: "MUHTARIN İTİRAFI",
tension: "TEHDİT",
text: "Muhtar sesini alçaltıyor: 'Müftü meselesini kapat delikanlı. O işin arkasında bu kasabanın en büyük kökleri var. Kendini ateşe atıyorsun.'",
choices: [{ text: "Devam Et", next: "muhtar_sorgu_menu" }]
},
terzi_sorgu_menu: {
title: "SORGU: ESKİ TERZİ",
tension: "KORKU DOLU BAKIŞLAR",
text: "Terzi dükkanında ipliklerin arasında titriyor. Yanındaki gümüş kol düğmesine bakarak sana gözlerini dikiyor.",
action: () => { interrogationState.terzi.talked = true; },
choices: [
{ text: "🔍 Kanıt Göster: Gümüş Kol Düğmesini göster ve kime ait olduğunu sor.", next: "terzi_itiraf" },
{ text: "🔙 Kasaba Merkezine Dön", next: "start" }
]
},
terzi_itiraf: {
title: "TERZİNİN İTİRAFI",
tension: "BÜYÜK İPUCU",
text: "Terzi yutkunuyor: 'Bu... Bu düğme Hakim beyin özel dikim ceketine ait! O gece fabrikanın orada birileriyle buluşacağını söylemişti. Lütfen beni karıştırmayın!'",
action: () => {
interrogationState.terzi.confessed = true;
if(!inventory.includes("Terzi İtirafı")) inventory.push("Terzi İtirafı");
},
choices: [{ text: "Devam Et", next: "start" }]
},
hakim_sorgu_menu: {
title: "SORGU: HAKİM",
tension: "TEHLİKELİ ZİRVESİ",
text: "Adliye binasında odasına girdiğinde Hakim son derece sakin ve kibar bir ifadeyle seni karşılıyor. 'Buyurun dedektif bey, adaletin kapısı herkese açıktır' diyor.",
action: () => { interrogationState.hakim.talked = true; },
choices: [
{ text: "🗣️ Suçla: 'Dedenin zehirlenmesi ve Müftü cinayetinin katili sensin!'", next: "hakim_tepki" },
{ text: "🔙 Kasaba Merkezine Dön", next: "start" }
]
},
hakim_tepki: {
title: "HAKİMİN TEPKİSİ",
tension: "ÖLÜMCÜL TEHDİT",
text: "Hakim hafifçe gülüyor: 'Kanıtın var mı delikanlı? Bu kasabada kanun benim. Eğer yeterli delilin yoksa sabaha çıkamazsın.' (Not: Yeterli delil topladıysan eski fabrikaya gitmelisin!)",
action: () => { interrogationState.hakim.nervous = true; },
choices: [{ text: "Kasaba Merkezine Dön", next: "start" }]
},
fabrika_gece: {
title: "MEKAN: ESKİ FABRİKA (FİNAL BÖLGESİ)",
tension: "HESAPLAŞMA",
text: "Zeytinyağı fabrikasının karanlık ve rutubetli zeminindesin. Elinde topladığın delillerle (Terzi İtirafı, Not Defteri, Kol Düğmesi) katille yüzleşme vakti geldi. Arkadan yaklaşan adım seslerini duyuyorsun...",
action: () => {},
choices: [
{ text: "⚖️ Delilleri sun ve Hakim'i adalete teslim et (Resmi Adalet Sonu)", next: "son_resmi_adalet" },
{ text: "🗡️ Adaleti kendi ellerine alıp katille hesaplaş (İntikam Sonu)", next: "son_intikam_tuzagi" },
{ text: "💸 Delilleri saklayıp Hakim'le anlaş (İhanet Sonu)", next: "son_kacis_ve_ihanet" },
{ text: "🏃‍♂️ Korkup kasabadan kaç (Kötü Son)", next: "son_korkak_kacis" }
]
},
/* SONLAR */
son_resmi_adalet: {
title: "SON I: ADALETİN TERTEMİZ ZAFERİ",
tension: "HUZURLU HAKİKAT",
text: "Topladığın terzi itirafı ve not defteri sayesinde jandarmayı harekete geçirdin. Hakim suçüstü yakalanarak tutuklandı. Dedenin ruhu huzura erdi. Sen ise efsanevi bir dedektif olarak kasabadan ayrıldın. Oyunu kazandın!",
action: () => {},
choices: [{ text: "🔄 Oyunu Baştan Başlat", next: "start" }]
},
son_intikam_tuzagi: {
title: "SON II: GÖZE GÖZ, DİŞE DİŞ",
tension: "KARANLIK HESAPLAŞMA",
text: "Resmi adaleti beklemeyip fabrikanın karanlığında intikamını aldın. Katil cezasını buldu ancak bu zafer senin ruhunda silinmez izler bıraktı. Oyunu tamamladın!",
action: () => {},
choices: [{ text: "🔄 Oyunu Baştan Başlat", next: "start" }]
},
son_kacis_ve_ihanet: {
title: "SON III: SESSİZ ORTAKLIK VE SUÇLULUK",
tension: "AĞIR BEDEL",
text: "Güçlü insanlarla masaya oturup susma payını kabul ettin. Cebin doldu ama vicdanın karardı. Kasabadan ayrılırken arkana baktığında sadece pişmanlık vardı. Oyunu bitirdin.",
action: () => {},
choices: [{ text: "🔄 Oyunu Baştan Başlat", next: "start" }]
},
son_korkak_kacis: {
title: "SON IV: UNUTULUŞ VE KORKU",
tension: "PİŞMANLIK",
text: "Tehlikeyi göze alamayıp ilk otobüsle kasabadan kaçtın. Dedenin katili elini kolunu sallayarak gezip sırrı mezara götürdü. Oyunu kaybettin.",
action: () => {},
choices: [{ text: "🔄 Oyunu Baştan Başlat", next: "start" }]
}
};
function renderScene(sceneKey) {
const scene = gameData[sceneKey];
if (scene.action) scene.action();
document.getElementById("chapterTitle").innerText = scene.title;
document.getElementById("tensionMeter").innerText = "ATMOSFER: " + scene.tension;
document.getElementById("storyText").innerText = scene.text;
speakText(scene.text);
let invText = inventory.length > 0 ? inventory.join(", ") : "Boş";
document.getElementById("inventoryBar").innerText = "ÇANTAN: [ " + invText + " ]";
const choicesArea = document.getElementById("choicesArea");
choicesArea.innerHTML = "";
scene.choices.forEach(choice => {
const btn = document.createElement("button");
btn.className = "choice-btn";
btn.innerText = choice.text;
btn.onclick = () => renderScene(choice.next);
choicesArea.appendChild(btn);
});
}
renderScene("start");
</script>
</body>
</html>
