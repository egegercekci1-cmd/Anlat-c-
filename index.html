<!DOCTYPE html>
<html>
<head>
<title>DevletSim</title>
<style>
body{
font-family: Arial;
text-align:center;
background:#1e1e2f;
color:white;
}

button{
padding:10px;
margin:10px;
font-size:16px;
cursor:pointer;
}

#stats{
font-size:20px;
margin:20px;
}
</style>
</head>

<body>

<h1>🌍 DevletSim</h1>
<h3>Ülkeni yönet!</h3>

<div id="stats"></div>

<button onclick="factory()">🏭 Fabrika Kur</button>
<button onclick="school()">🏫 Okul Yap</button>
<button onclick="army()">🛡️ Orduyu Güçlendir</button>
<button onclick="nature()">🌱 Doğa Projesi</button>

<h3 id="event"></h3>

<script>

let para = 100
let mutluluk = 70
let ordu = 50
let cevre = 80
let tur = 1

function goster(){

document.getElementById("stats").innerHTML =
"Tur: "+tur+"<br>"+
"💰 Para: "+para+"<br>"+
"😊 Mutluluk: "+mutluluk+"<br>"+
"🛡️ Ordu: "+ordu+"<br>"+
"🌱 Çevre: "+cevre

}

function olay(){

let r = Math.floor(Math.random()*4)

if(r==0){
para -=20
event("🌍 Deprem oldu! -20 para")
}

if(r==1){
para +=15
event("🔬 Teknoloji keşfi! +15 para")
}

if(r==2){
mutluluk -=20
event("😡 Halk protestosu! -20 mutluluk")
}

if(r==3){
para +=25
event("🏖️ Turizm patladı! +25 para")
}

}

function event(text){
document.getElementById("event").innerHTML=text
}

function nextTurn(){
tur++
olay()
kontrol()
goster()
}

function factory(){
para +=20
cevre -=10
mutluluk +=5
nextTurn()
}

function school(){
para -=10
mutluluk +=10
nextTurn()
}

function army(){
para -=15
ordu +=15
nextTurn()
}

function nature(){
para -=10
cevre +=15
mutluluk +=5
nextTurn()
}

function kontrol(){

if(para<=0 || mutluluk<=0 || cevre<=0){
alert("Ülken çöktü! Oyunu kaybettin.")
location.reload()
}

if(tur>20){

if(para>200 && mutluluk>60 && ordu>60){
alert("Tebrikler! Süper lider oldun 👑")
}else{
alert("20 tur bitti. Daha iyi yönetebilirdin.")
}

location.reload()

}

}

goster()

</script>

</body>
</html>
