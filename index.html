<!DOCTYPE html>
<html>
<head>
<title>DevletSim Ultimate</title>

<style>

body{
font-family:Arial;
text-align:center;
background:#0f172a;
color:white;
}

h1{
font-size:50px;
}

#stats{
background:#1e293b;
padding:25px;
margin:20px auto;
width:380px;
border-radius:12px;
font-size:22px;
}

button{
font-size:26px;
padding:25px 40px;
margin:12px;
border:none;
border-radius:12px;
cursor:pointer;
transition:0.2s;
width:260px;
}

button:hover{
transform:scale(1.08);
}

.factory{background:#f59e0b;}
.school{background:#3b82f6;}
.army{background:#ef4444;}
.nature{background:#22c55e;}
.tax{background:#a855f7;}
.city{background:#14b8a6;}
.space{background:#eab308;}
.save{background:#64748b;}

.map{
display:grid;
grid-template-columns:140px 140px 140px;
gap:12px;
justify-content:center;
margin-top:25px;
}

.country{
background:#334155;
padding:30px;
border-radius:12px;
cursor:pointer;
font-size:20px;
}

.player{
background:#22c55e;
}

.enemy{
background:#ef4444;
}

#event{
font-size:24px;
margin-top:20px;
}

</style>
</head>

<body>

<h1>🌍 DevletSim Ultimate</h1>

<div id="stats"></div>

<button class="factory" onclick="factory()">🏭 Fabrika</button>
<button class="school" onclick="school()">🏫 Okul</button>
<button class="army" onclick="army()">🛡 Ordu</button>
<button class="nature" onclick="nature()">🌱 Doğa</button>
<button class="tax" onclick="taxUp()">💰 Vergi +</button>
<button class="tax" onclick="taxDown()">💵 Vergi -</button>
<button class="city" onclick="city()">🏙 Şehir Kur</button>
<button class="space" onclick="space()">🛰 Uzay Programı</button>
<button class="save" onclick="save()">💾 Kaydet</button>
<button class="save" onclick="load()">📂 Yükle</button>

<h2>🗺 Harita</h2>

<div class="map">

<div class="country enemy" onclick="attack(0)">Ülke A</div>
<div class="country player">Sen</div>
<div class="country enemy" onclick="attack(1)">Ülke B</div>
<div class="country enemy" onclick="attack(2)">Ülke C</div>

</div>

<h3 id="event"></h3>

<script>

let para=150
let mutluluk=70
let ordu=60
let cevre=80
let nufus=1000000
let vergi=10
let sehir=1
let toprak=1
let uzay=0
let tur=1

let dusmanOrdu=[40,70,90]

function goster(){

document.getElementById("stats").innerHTML=

"Tur: "+tur+"<br>"+
"💰 Para: "+para+"<br>"+
"😊 Mutluluk: "+mutluluk+"<br>"+
"🛡 Ordu: "+ordu+"<br>"+
"🌱 Çevre: "+cevre+"<br>"+
"👥 Nüfus: "+nufus+"<br>"+
"🏙 Şehir: "+sehir+"<br>"+
"🌍 Toprak: "+toprak+"<br>"+
"🛰 Uzay: "+uzay+"<br>"+
"💵 Vergi: %"+vergi

}

function event(text){
document.getElementById("event").innerHTML=text
}

function gelir(){
para+=Math.floor(nufus/100000)*vergi
}

function olay(){

let r=Math.floor(Math.random()*5)

if(r==0){
para-=25
event("🌍 Deprem oldu!")
}

if(r==1){
para+=40
event("🏖 Turizm patladı!")
}

if(r==2){
mutluluk-=10
event("😡 Protesto!")
}

if(r==3){
cevre-=10
event("🏭 Kirlilik arttı!")
}

if(r==4){
nufus+=50000
event("👶 Nüfus arttı!")
}

}

function election(){

if(mutluluk>=50){

event("🗳 Seçimi kazandın! Halk seni tekrar seçti.")

}else{

alert("🗳 Seçimi kaybettin! Halk başka lider seçti.")
location.reload()

}

}

function nextTurn(){

gelir()

if(mutluluk>70) nufus+=20000
if(mutluluk<40) nufus-=20000

tur++

if(tur % 5 === 0){
election()
}

olay()

kontrol()

goster()

}

function factory(){
para+=40
cevre-=10
mutluluk+=3
nextTurn()
}

function school(){
para-=25
mutluluk+=15
nextTurn()
}

function army(){
para-=30
ordu+=25
nextTurn()
}

function nature(){
para-=20
cevre+=25
mutluluk+=5
nextTurn()
}

function taxUp(){
vergi+=2
mutluluk-=5
goster()
}

function taxDown(){
vergi-=2
mutluluk+=5
goster()
}

function city(){

if(para>=80){

para-=80
sehir++
nufus+=120000
event("🏙 Yeni şehir kuruldu!")

}else{

event("Yeterli para yok!")

}

goster()

}

function space(){

if(para>=120){

para-=120
uzay++
event("🛰 Uzay programı ilerledi!")

}else{

event("Yeterli para yok!")

}

goster()

}

function attack(i){

if(ordu>dusmanOrdu[i]){

event("⚔️ Savaşı kazandın!")

toprak++
ordu-=15
para+=60

}else{

event("⚔️ Savaşı kaybettin!")

mutluluk-=12
ordu-=15

}

goster()

}

function save(){

localStorage.setItem("devletsim",JSON.stringify({
para,mutluluk,ordu,cevre,nufus,vergi,sehir,toprak,uzay,tur
}))

event("💾 Oyun kaydedildi!")

}

function load(){

let data=JSON.parse(localStorage.getItem("devletsim"))

if(data){

para=data.para
mutluluk=data.mutluluk
ordu=data.ordu
cevre=data.cevre
nufus=data.nufus
vergi=data.vergi
sehir=data.sehir
toprak=data.toprak
uzay=data.uzay
tur=data.tur

event("📂 Oyun yüklendi!")

}

goster()

}

function kontrol(){

if(para<=0 || mutluluk<=0 || cevre<=0){

alert("Ülken çöktü!")
location.reload()

}

if(tur>40){

let skor=para+ordu+mutluluk+toprak*50+uzay*100

alert("Oyun bitti! Skor: "+skor)

location.reload()

}

}

goster()

</script>

</body>
</html>
