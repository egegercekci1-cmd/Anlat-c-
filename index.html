<!DOCTYPE html>
<html>
<head>
<title>DevletSim World</title>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
}

h1{
font-size:50px;
}

#stats{
background:#1e293b;
padding:25px;
margin:20px auto;
width:380px;
border-radius:12px;
font-size:22px;
}

button{
font-size:24px;
padding:20px 30px;
margin:10px;
border:none;
border-radius:12px;
cursor:pointer;
width:240px;
}

button:hover{
transform:scale(1.05);
}

.factory{background:#f59e0b;}
.school{background:#3b82f6;}
.army{background:#ef4444;}
.nature{background:#22c55e;}
.tax{background:#a855f7;}
.city{background:#14b8a6;}
.space{background:#eab308;}
.save{background:#64748b;}

.map{
display:grid;
grid-template-columns:repeat(5,140px);
gap:12px;
justify-content:center;
margin-top:30px;
}

.country{
background:#334155;
padding:25px;
border-radius:12px;
cursor:pointer;
}

.enemy{
background:#ef4444;
}

.player{
background:#22c55e;
}

#event{
font-size:24px;
margin-top:20px;
}

#electionScreen{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000000dd;
color:white;
text-align:center;
padding-top:150px;
font-size:30px;
}

</style>

</head>

<body>

<h1>🌍 DevletSim World</h1>

<div id="stats"></div>

<button class="factory" onclick="factory()">🏭 Fabrika</button>
<button class="school" onclick="school()">🏫 Okul</button>
<button class="army" onclick="army()">🛡 Ordu</button>
<button class="nature" onclick="nature()">🌱 Doğa</button>
<button class="tax" onclick="taxUp()">💰 Vergi +</button>
<button class="tax" onclick="taxDown()">💵 Vergi -</button>
<button class="city" onclick="city()">🏙 Şehir Kur</button>
<button class="space" onclick="space()">🛰 Uzay Programı</button>
<button class="save" onclick="save()">💾 Kaydet</button>
<button class="save" onclick="load()">📂 Yükle</button>

<h2>🗺 Dünya Haritası</h2>

<div class="map">

<div class="country enemy" onclick="attack(0)">🇫🇷 Fransa</div>
<div class="country enemy" onclick="attack(1)">🇩🇪 Almanya</div>
<div class="country enemy" onclick="attack(2)">🇮🇹 İtalya</div>
<div class="country enemy" onclick="attack(3)">🇪🇸 İspanya</div>
<div class="country enemy" onclick="attack(4)">🇬🇧 İngiltere</div>

<div class="country enemy" onclick="attack(5)">🇷🇺 Rusya</div>
<div class="country player">🇹🇷 Sen</div>
<div class="country enemy" onclick="attack(6)">🇬🇷 Yunanistan</div>
<div class="country enemy" onclick="attack(7)">🇮🇷 İran</div>
<div class="country enemy" onclick="attack(8)">🇨🇳 Çin</div>

</div>

<h3 id="event"></h3>

<div id="electionScreen">
<h1>🗳 Seçim Zamanı</h1>
<p id="voteResult"></p>
<button onclick="closeElection()">Devam</button>
</div>

<script>

let para=200
let mutluluk=70
let ordu=80
let cevre=80
let nufus=1000000
let vergi=10
let sehir=1
let toprak=1
let uzay=0
let tur=1

let enemyArmy=[60,70,65,60,75,90,50,80,100]

let countries=[
"🇫🇷 Fransa",
"🇩🇪 Almanya",
"🇮🇹 İtalya",
"🇪🇸 İspanya",
"🇬🇧 İngiltere",
"🇷🇺 Rusya",
"🇬🇷 Yunanistan",
"🇮🇷 İran",
"🇨🇳 Çin"
]

let conquered=[false,false,false,false,false,false,false,false,false]

let electionWin=true

function goster(){

document.getElementById("stats").innerHTML=

"Tur: "+tur+"<br>"+
"💰 Para: "+para+"<br>"+
"😊 Mutluluk: "+mutluluk+"<br>"+
"🛡 Ordu: "+ordu+"<br>"+
"🌱 Çevre: "+cevre+"<br>"+
"👥 Nüfus: "+nufus+"<br>"+
"🏙 Şehir: "+sehir+"<br>"+
"🌍 Toprak: "+toprak+"<br>"+
"🛰 Uzay: "+uzay+"<br>"+
"💵 Vergi: %"+vergi

}

function event(text){
document.getElementById("event").innerHTML=text
}

function gelir(){
para+=Math.floor(nufus/100000)*vergi
}

function election(){

let oy=mutluluk+Math.floor(Math.random()*20)
let rakip=100-oy

document.getElementById("electionScreen").style.display="block"

document.getElementById("voteResult").innerHTML=
"Sen: %"+oy+"<br>Rakip: %"+rakip

if(oy>=rakip){
electionWin=true
}else{
electionWin=false
}

}

function closeElection(){

document.getElementById("electionScreen").style.display="none"

if(!electionWin){
alert("Seçimi kaybettin!")
location.reload()
}

}

function aiAttack(){

let r=Math.floor(Math.random()*100)

if(r<35){

let enemy=Math.floor(Math.random()*enemyArmy.length)

if(!conquered[enemy]){

if(enemyArmy[enemy]>ordu){

event("⚔️ "+countries[enemy]+" sana saldırdı ve kazandı!")

mutluluk-=10
para-=40
ordu-=15

}else{

event("🛡 "+countries[enemy]+" sana saldırdı ama savundun!")

ordu-=5

}

}

}

}

function nextTurn(){

gelir()

if(mutluluk>70) nufus+=20000
if(mutluluk<40) nufus-=20000

tur++

aiAttack()

if(tur%5===0){
election()
}

goster()

}

function factory(){
para+=40
cevre-=10
mutluluk+=3
nextTurn()
}

function school(){
para-=30
mutluluk+=15
nextTurn()
}

function army(){
para-=40
ordu+=30
nextTurn()
}

function nature(){
para-=20
cevre+=25
mutluluk+=5
nextTurn()
}

function taxUp(){
vergi+=2
mutluluk-=5
goster()
}

function taxDown(){
vergi-=2
mutluluk+=5
goster()
}

function city(){

if(para>=80){
para-=80
sehir++
nufus+=120000
event("Yeni şehir kuruldu")
}else{
event("Para yetmiyor")
}

goster()

}

function space(){

if(para>=120){
para-=120
uzay++
event("Uzay programı ilerledi")
}else{
event("Para yetmiyor")
}

goster()

}

function attack(i){

if(conquered[i]){
event("Bu ülkeyi zaten fethettin")
return
}

if(ordu>enemyArmy[i]){

event("⚔️ Savaşı kazandın!")

toprak++
ordu-=10
para+=60

conquered[i]=true

let countriesHTML=document.querySelectorAll(".enemy")

countriesHTML[i].innerHTML="🇹🇷 Türkiye"
countriesHTML[i].classList.remove("enemy")
countriesHTML[i].classList.add("player")

}else{

event("⚔️ Savaşı kaybettin!")

ordu-=15
mutluluk-=10

}

goster()

}

function save(){

localStorage.setItem("devletsim",JSON.stringify({
para,mutluluk,ordu,cevre,nufus,vergi,sehir,toprak,uzay,tur
}))

event("Oyun kaydedildi")

}

function load(){

let data=JSON.parse(localStorage.getItem("devletsim"))

if(data){

para=data.para
mutluluk=data.mutluluk
ordu=data.ordu
cevre=data.cevre
nufus=data.nufus
vergi=data.vergi
sehir=data.sehir
toprak=data.toprak
uzay=data.uzay
tur=data.tur

event("Oyun yüklendi")

}

goster()

}

goster()

</script>

</body>
</html>
