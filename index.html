<!DOCTYPE html>
<html>
<head>
<title>DevletSim Map</title>

<style>

body{
font-family:Arial;
text-align:center;
background:#0f172a;
color:white;
}

#stats{
background:#1e293b;
padding:20px;
margin:20px auto;
width:350px;
border-radius:10px;
}

button{
font-size:20px;
padding:15px 20px;
margin:10px;
border:none;
border-radius:10px;
cursor:pointer;
}

button:hover{
transform:scale(1.05);
}

.map{
display:grid;
grid-template-columns:120px 120px 120px;
gap:10px;
justify-content:center;
margin-top:20px;
}

.country{
background:#334155;
padding:30px;
border-radius:10px;
}

.player{
background:#22c55e;
}

.enemy{
background:#ef4444;
}

</style>
</head>

<body>

<h1>🌍 DevletSim Harita</h1>

<div id="stats"></div>

<button onclick="factory()">🏭 Fabrika</button>
<button onclick="army()">🛡 Ordu</button>
<button onclick="school()">🏫 Okul</button>

<h2>🗺 Harita</h2>

<div class="map">

<div class="country enemy" onclick="attack(0)">Ülke A</div>
<div class="country player">Sen</div>
<div class="country enemy" onclick="attack(1)">Ülke B</div>

<div class="country enemy" onclick="attack(2)">Ülke C</div>

</div>

<h3 id="event"></h3>

<script>

let para=100
let mutluluk=70
let ordu=60
let toprak=1

let dusmanOrdu=[40,50,70]

function goster(){

document.getElementById("stats").innerHTML=

"💰 Para: "+para+"<br>"+
"😊 Mutluluk: "+mutluluk+"<br>"+
"🛡 Ordu: "+ordu+"<br>"+
"🌍 Toprak: "+toprak

}

function event(text){

document.getElementById("event").innerHTML=text

}

function factory(){

para+=20
mutluluk+=3
event("Yeni fabrika kuruldu!")

goster()

}

function school(){

mutluluk+=10
para-=10
event("Yeni okul yapıldı!")

goster()

}

function army(){

ordu+=20
para-=20
event("Ordu güçlendi!")

goster()

}

function attack(i){

if(ordu>dusmanOrdu[i]){

event("⚔️ Savaşı kazandın! Yeni toprak aldın.")

toprak++

ordu-=10

}else{

event("⚔️ Savaşı kaybettin!")

mutluluk-=10

}

goster()

}

goster()

</script>

</body>
</html>
