<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ege Gizemi - Kesintisiz Sürüm</title>
<style>
:root {
--bg-color: #0c0f0e;
--container-bg: #131a16;
--border-color: #243328;
--accent-green: #34d399;
--accent-gold: #fbbf24;
--accent-red: #f87171;
--text-main: #e2e8f0;
--text-muted: #94a3b8;
--btn-bg: #1c2820;
--btn-hover: #293b2f;
}
body {
margin: 0;
background: var(--bg-color);
color: var(--text-main);
font-family: 'Georgia', serif;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
min-height: 100vh;
padding: 15px;
box-sizing: border-box;
}
.game-container {
width: 100%;
max-width: 650px;
background: var(--container-bg);
border: 2px solid var(--border-color);
border-radius: 16px;
box-shadow: 0 25px 60px rgba(0,0,0,0.85);
overflow: hidden;
display: flex;
flex-direction: column;
position: relative;
}
.top-panel {
background: #17211b;
border-bottom: 1px solid var(--border-color);
display: flex;
flex-direction: column;
}
.status-bar {
padding: 12px 20px;
display: flex;
justify-content: space-between;
font-size: 11px;
font-family: 'Segoe UI', Tahoma, sans-serif;
font-weight: bold;
color: var(--accent-green);
letter-spacing: 1.5px;
text-transform: uppercase;
}
.audio-controls {
padding: 8px 20px;
background: #0f1411;
display: flex;
justify-content: space-between;
align-items: center;
font-size: 12px;
font-family: 'Segoe UI', Tahoma, sans-serif;
border-top: 1px solid #1f2b23;
}
.audio-btn {
background: #243328;
color: var(--accent-green);
border: 1px solid var(--accent-green);
padding: 4px 10px;
border-radius: 4px;
cursor: pointer;
font-size: 11px;
font-weight: bold;
transition: all 0.2s;
}
.audio-btn:hover {
background: var(--accent-green);
color: #0c0f0e;
}
.inventory-bar {
background: #0a0e0b;
padding: 10px 20px;
font-size: 12px;
color: var(--accent-gold);
border-bottom: 1px solid var(--border-color);
font-family: monospace;
letter-spacing: 0.5px;
}
.screen-area {
padding: 30px;
min-height: 240px;
display: flex;
align-items: center;
justify-content: center;
text-align: justify;
font-size: 16px;
line-height: 1.95;
color: #f1f5f9;
border-bottom: 1px solid var(--border-color);
background: radial-gradient(circle, #18231c 0%, #131a16 100%);
position: relative;
}
.choices-area {
padding: 20px;
display: flex;
flex-direction: column;
gap: 12px;
background: #0f1411;
}
.choice-btn {
background: var(--btn-bg);
color: var(--text-main);
border: 1px solid #2d3d32;
padding: 15px 18px;
border-radius: 10px;
cursor: pointer;
text-align: left;
font-size: 14px;
font-family: 'Segoe UI', Tahoma, sans-serif;
transition: all 0.25s ease;
box-shadow: 0 4px 6px rgba(0,0,0,0.2);
}
.choice-btn:hover {
background: var(--btn-hover);
border-color: var(--accent-green);
transform: translateY(-2px);
box-shadow: 0 6px 12px rgba(52,211,153,0.15);
}
.qte-overlay {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(12, 15, 14, 0.95);
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
z-index: 10;
padding: 20px;
box-sizing: border-box;
text-align: center;
}
.qte-title {
color: var(--accent-red);
font-size: 18px;
font-family: 'Segoe UI', Tahoma, sans-serif;
font-weight: bold;
margin-bottom: 15px;
letter-spacing: 2px;
text-transform: uppercase;
}
.qte-timer-bar {
width: 80%;
height: 8px;
background: #243328;
border-radius: 4px;
overflow: hidden;
margin-bottom: 25px;
}
.qte-timer-fill {
height: 100%;
background: var(--accent-red);
width: 100%;
transition: width linear;
}
.qte-click-btn {
background: #991b1b;
color: white;
border: 2px solid #f87171;
padding: 20px 40px;
font-size: 20px;
font-weight: bold;
border-radius: 50%;
cursor: pointer;
box-shadow: 0 0 20px rgba(248, 113, 113, 0.5);
transition: transform 0.1s;
}
.qte-click-btn:active {
transform: scale(0.9);
}
</style>
</head>
<body>
<div class="game-container">
<div class="top-panel">
<div class="status-bar">
<span id="chapterTitle">BÖLÜM 1: ORTAKLIĞIN İLK GÜNÜ</span>
<span id="tensionMeter">ATMOSFER: GERİLİMLİ</span>
</div>
<div class="audio-controls">
<span id="audioStatus">🔊 Seslendirme: Hazır</span>
<div>
<button class="audio-btn" onclick="togglePauseSpeech()">Durdur / Devam Et</button>
<button class="audio-btn" onclick="replaySpeech()">Tekrar Dinle</button>
</div>
</div>
</div>
<div class="inventory-bar" id="inventoryBar">ÇANTAN: [ Boş ]</div>
<div class="screen-area" id="storyText">Oyun başlatılıyor...</div>
<div class="choices-area" id="choicesArea">
<button class="choice-btn" onclick="renderScene('start')">▶️ Oyuna Başla / Devam Et</button>
</div>
</div>
<script>
let inventory = [];
let currentText = "";
let isPaused = false;
function speakText(text) {
currentText = text;
if ('speechSynthesis' in window) {
window.speechSynthesis.cancel();
let utterance = new SpeechSynthesisUtterance(text);
utterance.lang = 'tr-TR';
utterance.rate = 0.92;
utterance.pitch = 0.85;
utterance.onstart = () => { document.getElementById("audioStatus").innerText = "🔊 Seslendirme: Çalıyor..."; };
utterance.onend = () => { document.getElementById("audioStatus").innerText = "🔈 Seslendirme: Tamamlandı"; };
window.speechSynthesis.speak(utterance);
}
}
function togglePauseSpeech() {
if ('speechSynthesis' in window) {
if (window.speechSynthesis.speaking) {
if (isPaused) {
window.speechSynthesis.resume();
isPaused = false;
document.getElementById("audioStatus").innerText = "🔊 Seslendirme: Çalıyor...";
} else {
window.speechSynthesis.pause();
isPaused = true;
document.getElementById("audioStatus").innerText = "⏸️ Seslendirme: Duraklatıldı";
}
}
}
}
function replaySpeech() {
if (currentText) {
isPaused = false;
speakText(currentText);
}
}
function startQTE(promptText, durationSeconds, successNextScene, failNextScene) {
if ('speechSynthesis' in window) {
window.speechSynthesis.cancel();
}
const screenArea = document.getElementById("storyText");
const choicesArea = document.getElementById("choicesArea");
choicesArea.innerHTML = "";
speakText("Dikkat! Hızlı hareket et!");
screenArea.innerHTML = ⁠<div class="qte-overlay"> <div class="qte-title">⚠️ ${promptText}</div> <div class="qte-timer-bar"> <div class="qte-timer-fill" id="qteTimerFill" style="transition-duration: ${durationSeconds}s;"></div> </div> <button class="qte-click-btn" id="qteButton">TIKLA!</button> </div>⁠;
setTimeout(() => {
const fill = document.getElementById("qteTimerFill");
if (fill) fill.style.width = "0%";
}, 50);
let clicked = false;
const btn = document.getElementById("qteButton");
btn.onclick = () => {
if (!clicked) {
clicked = true;
clearTimeout(timer);
renderScene(successNextScene);
}
};
const timer = setTimeout(() => {
if (!clicked) {
clicked = true;
renderScene(failNextScene);
}
}, durationSeconds * 1000);
}
const gameData = {
start: {
title: "BÖLÜM 1: KUŞAKLARIN BULUŞMASI",
tension: "SERBEST KEŞİF & ORTAKLIK",
text: "İzmir'in tarihi taş sokaklarında deden Ruhan Tonguç ile omuz omuza yürüyorsun. Kasabayı kasıp kavuran o tehlikeli sırrı ortaya çıkarmak için artık yalnız değilsin; deden ölümden döndü ve en büyük yardımcın olarak dosyanın başında! Kasabada serbestçe hareket edebilir, delil arayabilir ya da şüphelileri sorgulayabilirsiniz.",
action: () => { inventory = []; },
choices: [
{ text: "🏠 Dedenin Eski Evine Git (Ortak İnceleme ve Deliller)", next: "olay_yeri" },
{ text: "☕ Kasaba Meydanı / Kahvehaneye Git (Muhtarı Sorgula)", next: "muhtar_sorgu_menu" },
{ text: "🧵 Çarşıdaki Terziye Git (Şüpheli Kol Düğmesini Sor)", next: "terzi_sorgu_menu" },
{ text: "⚖️ Adliye / Hakimlik Binasına Git (Hakimle Yüzleş)", next: "hakim_sorgu_menu" },
{ text: "🏭 Eski Zeytinyağı Fabrikasına Git (Tehlikeli Baskın)", next: "fabrika_baskin_giris" }
]
},
olay_yeri: {
title: "MEKAN: DEDENİN EVİ",
tension: "DEDEDEN TORUNA ORTAKLIK",
text: "Taş evin salonunda deden Ruhan çayını yudumlarken masadaki belgeleri inceliyor. 'Evlat, yıllar önce Müftü cinayetini ben de araştırıyordum ama Hakim beni zehirlemeye kalktı. Şimdi birlikte bu işi bitireceğiz' diyor. Masada dedenin gizli notları ve gümüş kol düğmesi duruyor.",
action: () => {
if(!inventory.includes("Polis Not Defteri")) inventory.push("Polis Not Defteri");
if(!inventory.includes("Gümüş Kol Düğmesi")) inventory.push("Gümüş Kol Düğmesi");
},
choices: [
{ text: "📜 Not Defterindeki şifreleri dedenle birlikte çöz", next: "not_detay" },
{ text: "🗺️ Kasaba Merkezine Geri Dön", next: "start" }
]
},
not_detay: {
title: "ORTAK ANALİZ",
tension: "GİZEM AYDINLANIYOR",
text: "Dedenle birlikte defteri incelediğinizde, eski Müftü cinayetinin Hakim tarafından örtbas edildiğini ve tüm delillerin fabrikanın altındaki kasada saklandığını kesinleştiriyorsunuz.",
action: () => {
if(!inventory.includes("Dosya Bağlantısı")) inventory.push("Dosya Bağlantısı");
},
choices: [
{ text: "Kasaba Merkezine Dön", next: "start" }
]
},
muhtar_sorgu_menu: {
title: "SORGU: MUHTAR İSMAİL",
tension: "GERGİN DİYALOG",
text: "Yanında deden Ruhan'ı canlı kanlı görünce Muhtar İsmail'in rengi sararıyor! Ağzı açık kalıyor. Deden Ruhan sert bir sesle, 'Şaşırdın değil mi İsmail?' diyor.",
action: () => {},
choices: [
{ text: "🗣️ Sorgula: 'Cinayet gecesi Hakim ile ne konuştunuz?'", next: "muhtar_itiraf_2" },
{ text: "🔙 Kasaba Merkezine Dön", next: "start" }
]
},
muhtar_itiraf_2: {
title: "MUHTARIN İTİRAFI",
tension: "KORKU DOLU İTİRAF",
text: "Muhtar kekeleyerek: 'R... Ruhan hoca! Sen ölmemiş miydin? Tamam anlatıyorum! Hakim beni tehdit etti, cinayeti örtbas etmezsem fabrikayı başıma yıkarım dedi!'",
action: () => {
if(!inventory.includes("Muhtarın İtirafı")) inventory.push("Muhtarın İtirafı");
},
choices: [{ text: "Devam Et", next: "muhtar_sorgu_menu" }]
},
terzi_sorgu_menu: {
title: "SORGU: ESKİ TERZİ",
tension: "TİTRERKEN",
text: "Terzi dükkanında dedeni görünce elleri titremeye başlıyor. Gümüş kol düğmesini masaya koyuyorsunuz.",
action: () => {},
choices: [
{ text: "🔍 Kanıt Göster: Kol düğmesinin Hakim'e ait olduğunu onaylat.", next: "terzi_itiraf" },
{ text: "🔙 Kasaba Merkezine Dön", next: "start" }
]
},
terzi_itiraf: {
title: "TERZİNİN İTİRAFI",
tension: "KESİN KANIT",
text: "Terzi: 'Evet, evet! Bu düğme Hakim beyin ceketine ait. Fabrikadaki buluşmaya giderken benden diktirmişti!'",
action: () => {
if(!inventory.includes("Terzi İtirafı")) inventory.push("Terzi İtirafı");
},
choices: [{ text: "Devam Et", next: "start" }]
},
hakim_sorgu_menu: {
title: "SORGU: HAKİM",
tension: "TEHLİKELİ ZİRVE",
text: "Adliye odasına dedenle birlikte girdiğinizde Hakim ayağa kalkıyor. Karşısında hayalet görmüş gibi dönüp kalıyor, ardından çılgına dönüyor.",
action: () => {},
choices: [
{ text: "🗣️ Suçla: 'Oyun bitti Hakim, terzi ve muhtar her şeyi ötü!'", next: "qte_hakim_saldiri" },
{ text: "🔙 Kasaba Merkezine Dön", next: "start" }
]
},
qte_hakim_saldiri: {
title: "HIZLI TEPKİ GEREKLİ",
tension: "ÖLÜM KALIM",
action: () => {
startQTE("HAKİM ATEŞ ETMEDEN ÖNCE SİLAHA ATLAYIN!", 3.0, "hakim_alt_etme", "hakim_qte_basarisiz");
},
choices: []
},
hakim_alt_etme: {
title: "BAŞARILI HAMLE",
tension: "ZAFER ANI",
text: "Şimşek gibi öne atılıp Hakim'in bileğini yakaladın ve silahı etkisiz hale getirdin! Deden Ruhan hemen arkandan gelerek Hakim'i duvara sabitledi. Zekan ve hızın sayesinde hayat kurtardın!",
action: () => {
if(!inventory.includes("Hakim Suçüstü")) inventory.push("Hakim Suçüstü");
},
choices: [
{ text: "⚖️ Jandarmayı çağır ve Hakim'i adalete teslim et (Mutlu Son)", next: "son_resmi_adalet" },
{ text: "🗡️ Fabrikaya gidip tüm ekiple büyük hesaplaşmayı yap", next: "fabrika_baskin_giris" }
]
},
hakim_qte_basarisiz: {
title: "ZAMAN AŞIMI",
tension: "YARALANMA",
text: "Çok yavaş davrandın! Hakim tetiği çekti ancak deden Ruhan son anda senin önüne atılarak kurşunu omzuna aldı! Neyse ki deden ölmedi ama yaralandı. Şimdi acele etmelisin!",
action: () => {},
choices: [
{ text: "Hemen jandarmayı çağırıp Hakim'i tutuklat", next: "son_resmi_adalet" }
]
},
fabrika_baskin_giris: {
title: "MEKAN: ESKİ FABRİKA BASKINI",
tension: "SON HESAPLAŞMA",
text: "Deden Ruhan ile birlikte eski zeytinyağı fabrikasının demir kapısını kollarınızla itip içeri giriyorsunuz. İçeride suç ortakları sizi bekliyor.",
action: () => {},
choices: [
{ text: "⚡ Pusuya düşen gruba karşı HIZLICA harekete geç! (QTE)", next: "qte_fabrika_baskin" },
{ text: "⚖️ Delilleri sunarak ve dedenle operasyonu tamamla", next: "son_resmi_adalet" }
]
},
qte_fabrika_baskin: {
title: "FABRİKA PUSUSU",
tension: "AKSİYON",
action: () => {
startQTE("ÜZERİNİZE GELEN SALDIRGANI SAVUŞTURUN!", 2.5, "son_resmi_adalet", "son_resmi_adalet");
},
choices: []
},
son_resmi_adalet: {
title: "MUTLAK SON: DEDENLE OMUZ OMUZA ADALET",
tension: "HUZURLU ZAFER",
text: "Topladığınız deliller, terzi itirafı ve deden Ruhan'ın sağ salim yanınızda durması sayesinde jandarma baskınıyla Hakim ve tüm çete çökertildi. Kasabada adalet yeniden sağlandı. Sen ve deden bu hikayenin kahramanları olarak efsaneleştiniz. Oyunu kazandın!",
action: () => {},
choices: [{ text: "🔄 Oyunu Baştan Başlat", next: "start" }]
}
};
function renderScene(sceneKey) {
const scene = gameData[sceneKey];
if (!scene) return;
if (scene.action) scene.action();
document.getElementById("chapterTitle").innerText = scene.title;
document.getElementById("tensionMeter").innerText = "ATMOSFER: " + scene.tension;
document.getElementById("storyText").innerText = scene.text;
if(sceneKey !== "qte_hakim_saldiri" && sceneKey !== "qte_fabrika_baskin") {
speakText(scene.text);
}
let invText = inventory.length > 0 ? inventory.join(", ") : "Boş";
document.getElementById("inventoryBar").innerText = "ÇANTAN: [ " + invText + " ]";
const choicesArea = document.getElementById("choicesArea");
choicesArea.innerHTML = "";
if (scene.choices && scene.choices.length > 0) {
scene.choices.forEach(choice => {
const btn = document.createElement("button");
btn.className = "choice-btn";
btn.innerText = choice.text;
btn.onclick = () => renderScene(choice.next);
choicesArea.appendChild(btn);
});
}
}
</script>
</body>
</html>
