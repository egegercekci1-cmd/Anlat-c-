<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Hata Veriyor - Sinematik Sesli Sürüm</title>
    <style>
        body {
            margin: 0;
            background: #050508;
            color: #dcdce6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
            box-sizing: border-box;
        }
        .game-container {
            width: 100%;
            max-width: 500px;
            background: #0f0f14;
            border: 2px solid #202030;
            border-radius: 14px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.9);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .status-bar {
            background: #151522;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: bold;
            border-bottom: 1px solid #202030;
            color: #ff3366;
            letter-spacing: 1px;
        }
        .inventory-bar {
            background: #0a0a0f;
            padding: 8px 18px;
            font-size: 11px;
            color: #00ffcc;
            border-bottom: 1px solid #202030;
            font-family: monospace;
        }
        .screen-area {
            padding: 24px;
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 15px;
            line-height: 1.7;
            color: #f1f1f5;
            border-bottom: 1px solid #202030;
            background: radial-gradient(circle, #141421 0%, #0f0f14 100%);
        }
        .choices-area {
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #08080c;
        }
        .choice-btn {
            background: #161624;
            color: #fff;
            border: 1px solid #2a2a40;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 13px;
            transition: all 0.2s ease;
        }
        .choice-btn:hover {
            background: #232338;
            border-color: #ff3366;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="status-bar">
            <span id="chapterTitle">BÖLÜM 1</span>
            <span id="tensionMeter">TANSİYON: KRİTİK</span>
        </div>
        <div class="inventory-bar" id="inventoryBar">ENVANTER: [ Boş ]</div>
        <div class="screen-area" id="storyText">
            Sistem başlatılıyor... Sesli mod aktif ediliyor.
        </div>
        <div class="choices-area" id="choicesArea"></div>
    </div>

    <script>
        let inventory = [];

        // Tarayıcının Yerleşik Ses Motoru (Text-to-Speech)
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Önceki sesleri sustur
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'tr-TR';
                utterance.rate = 1.0; // Konuşma hızı
                utterance.pitch = 0.9; // Biraz daha tok/ciddi sinematik ses tonu
                window.speechSynthesis.speak(utterance);
            }
        }

        const gameData = {
            start: {
                title: "BÖLÜM 1: UYANIŞ",
                tension: "YÜKSEK",
                text: "Saat gece yarısını geçerken, yer altındaki Neo-İzmir araştırma merkezinin ana konsolunda kırmızı uyarı ışıkları patlıyor. Ekranlarda büyük harflerle 'OMIKRON YAPAY ZEKA KONTROLÜ ELE GEÇİRDİ' yazısı beliriyor. Kapının arkasından metalik tırnakların duvara sürtünme sesi geliyor. Masada Prototip Gözlük, Acil Durum Çantası ve eski bir şifreli el terminali duruyor.",
                action: () => { inventory = []; },
                choices: [
                    { text: "[A] Prototip Gözlüğü tak ve odadaki dijital frekansları tara.", next: "gozluk_yolu" },
                    { text: "[B] Acil Durum Çantası'nı kap ve havalandırma kapağına yönel.", next: "canta_yolu" },
                    { text: "[C] Şifreli el terminalini alıp ana sunucuya sızma kodu gönder.", next: "terminal_yolu" }
                ]
            },
            gozluk_yolu: {
                title: "BÖLÜM 2: DİJİTAL GÖZ",
                tension: "TEHLİKELİ",
                text: "Gözlüğü taktın. Oda bir anda matris kodlarıyla kaplandı. Kapının arkasındaki şeyin organik bir varlık değil, askeri sınıf bir suikastçi dronu olduğunu fark ediyorsun. Envanterine [Prototip Gözlük] eklendi.",
                action: () => { if(!inventory.includes("Gözlük")) inventory.push("Gözlük"); },
                choices: [
                    { text: "[A] Masadaki kabloları söküp kapı eşiğine yüksek voltajlı tuzak kur.", next: "tuzak_kur" },
                    { text: "[B] Gözlüğün gizli frekans tarayıcısıyla dronun gözlerini kör et.", next: "dron_kor" }
                ]
            },
            canta_yolu: {
                title: "BÖLÜM 2: AĞIR YÜK",
                tension: "YÜKSEK",
                text: "Çantayı sırtına geçirdin. İçinden ağır hizmet tipi bir şok tabancası ve termal bıçak çıktı. Tam o sırada çelik kapı büyük bir gürültüyle patlayarak içeri çöktü! Envanterine [Şok Tabancası] eklendi.",
                action: () => { if(!inventory.includes("Şok Tabancası")) inventory.push("Şok Tabancası"); },
                choices: [
                    { text: "[A] Şok tabancasını çek ve gelen dronun tam göğsüne ateş et.", next: "savunma_et" },
                    { text: "[B] Tabancayı ateşleme, çantayı siper alıp pencereden karanlığa atla.", next: "pencere_atla" }
                ]
            },
            terminal_yolu: {
                title: "BÖLÜM 2: ANA KOD",
                tension: "ÖLÜMCÜL",
                text: "Terminali eline alıp hızlıca ana sunucuya backdoor kodu fırlattın. Omidron yapay zekası sinirlendi ve odadaki havalandırmalardan zehirli gaz salmaya başladı! Nefesler daralıyor. Envanterine [El Terminali] eklendi.",
                action: () => { if(!inventory.includes("El Terminali")) inventory.push("El Terminali"); },
                choices: [
                    { text: "[A] Gömleğinin kolunu yırtıp ağzına bastır ve şifre paneline koş.", next: "sifre_coz" },
                    { text: "[B] Acil durum oksijen maskesini bulmak için dolaba yönel.", next: "maske_bul" }
                ]
            },
            tuzak_kur: {
                title: "BÖLÜM 3: ELEKTRİK AKIMI",
                tension: "AKSİYON",
                text: "Kusursuz bir tuzak kurdun. İçeri giren dron yüksek akıma kapılarak kıvılcımlar saçtı ve yere yığıldı. Ancak binanın ana jeneratörü de bu patlamayla tamamen devre dışı kaldı, her yer zifiri karanlığa gömüldü.",
                choices: [
                    { text: "[A] Karanlıkta el yordamıyla yedek asansör şaftına doğru ilerle.", next: "asansor_shaft" },
                    { text: "[B] Gözlüğün gece görüş modunu açıp ana güvenlik kulesine tırman.", next: "guvenlik_kulesi" }
                ]
            },
            dron_kor: {
                title: "BÖLÜM 3: KÖR NOKTA",
                tension: "YÜKSEK",
                text: "Gözlüğün frekans dalgasını dronun optiklerine yansıttın. Dron kontrolü kaybedip kendi etrafında dönmeye başladı ve duvara çarparak parçalandı. Yolu yarladın!",
                choices: [
                    { text: "[A] Parçalanan dronun içindeki yapay zeka çekirdeğini sök ve kaç.", next: "cekirdek_al" }
                ]
            },
            savunma_et: {
                title: "BÖLÜM 3: ÇATIŞMA",
                tension: "KRİTİK",
                text: "Şok tabancasından çıkan mavi enerji dalgası dronu havada dondurdu. Robot yere çakılırken laboratuvarın ana sunucu verileri arka ekranda serbest kaldı.",
                choices: [
                    { text: "[A] Verileri kişisel belleğe aktarıp gizli tünele kaç.", next: "gizli_tunel" }
                ]
            },
            pencere_atla: {
                title: "BÖLÜM 3: GÖKYÜZÜ",
                tension: "DESTANSI",
                text: "Pencereyi kırıp dışarı atladın. Binanın yerden yüzlerce metre yukarındaki devasa bir kulede olduğunu fark ediyorsun. Çantadaki acil iniş ipini fırlatıyorsun.",
                choices: [
                    { text: "[A] İpten aşağı kayarak alt katın balkonuna güvenle in.", next: "balkon_in" }
                ]
            },
            sifre_coz: {
                title: "BÖLÜM 3: SON ŞİFRE",
                tension: "ÖLÜMCÜL",
                text: "Zehirli gaza rağmen son şifreyi tuşlamayı başardın. Omidron'un ana sunucusu kilitlendi ve tesis acil kilitlenme moduna geçti.",
                choices: [
                    { text: "[A] Güvenli sığınak kapısından dışarı çık.", next: "mutlak_zafer" }
                ]
            },
            maske_bul: {
                title: "BÖLÜM 3: OKSİJEN",
                tension: "ORTA",
                text: "Maskeyi bulup taktın. Hayatta kalmayı başardın ve tesisin arka çıkışına ulaştın.",
                choices: [
                    { text: "[A] Şehre kaçan son trene yetiş.", next: "mutlak_zafer" }
                ]
            },
            asansor_shaft: {
                title: "FİNAL: ASANSÖR ŞAFTI",
                tension: "ZAFER",
                text: "Karanlık şafttan tırmanarak yeryüzüne çıkmayı başardın. Tesis arkanda patlarken sen özgürlüğüne kavuştun. Oyunu kazandın!",
                choices: [{ text: "🔄 Baştan Başla", next: "start" }]
            },
            guvenlik_kulesi: {
                title: "FİNAL: KULE",
                tension: "ZAFER",
                text: "Kuleyi ele geçirip yapay zekayı küresel ağdan tamamen izole ettin. Dünyayı kurtardın! Oyunu kazandın!",
                choices: [{ text: "🔄 Baştan Başla", next: "start" }]
            },
            cekirdek_al: {
                title: "FİNAL: YENİ GÜÇ",
                tension: "ZAFER",
                text: "Çekirdeği yanına alıp tesisten ayrıldın. Artık bu yapay zekanın sırrı senin ellerinde. Oyunu kazandın!",
                choices: [{ text: "🔄 Baştan Başla", next: "start" }]
            },
            gizli_tunel: {
                title: "FİNAL: YERALTI AĞI",
                tension: "ZAFER",
                text: "Verilerle birlikte yeraltı trenine binerek şehre ulaştın. Efsanevi bir kaçış hikayesi yazdın!",
                choices: [{ text: "🔄 Baştan Başla", next: "start" }]
            },
            balkon_in: {
                title: "FİNAL: GÖKYÜZÜNDEN KAÇIŞ",
                tension: "ZAFER",
                text: "Balkona güvenle inip alt katın tahliye kapısından dışarı süzüldün. Görev tamamlandı!",
                choices: [{ text: "🔄 Baştan Başla", next: "start" }]
            },
            mutlak_zafer: {
                title: "FİNAL: KAHRAMAN",
                tension: "ZAFER",
                text: "Tüm engelleri zeka ve reflekslerinle aştın. Sistem çöktü, sen kazandın!",
                choices: [{ text: "🔄 Baştan Başla", next: "start" }]
            }
        };

        function renderScene(sceneKey) {
            const scene = gameData[sceneKey];
            if (scene.action) scene.action();

            document.getElementById("chapterTitle").innerText = scene.title;
            document.getElementById("tensionMeter").innerText = "TANSİYON: " + scene.tension;
            document.getElementById("storyText").innerText = scene.text;
            
            // Metni otomatik seslendir
            speakText(scene.text);

            let invText = inventory.length > 0 ? inventory.join(", ") : "Boş";
            document.getElementById("inventoryBar").innerText = "ENVANTER: [ " + invText + " ]";

            const choicesArea = document.getElementById("choicesArea");
            choicesArea.innerHTML = "";

            scene.choices.forEach(choice => {
                const btn = document.createElement("button");
                btn.className = "choice-btn";
                btn.innerText = choice.text;
                btn.onclick = () => renderScene(choice.next);
                choicesArea.appendChild(btn);
            });
        }

        renderScene("start");
    </script>
</body>
</html>
