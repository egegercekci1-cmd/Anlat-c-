<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DevletSim World</title>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
}

#stats{
background:#1e293b;
padding:20px;
width:350px;
margin:20px auto;
border-radius:10px;
font-size:20px;
}

/* BUTON PANELİ */

.controls{
display:grid;
grid-template-columns:repeat(3,200px);
gap:12px;
justify-content:center;
margin-top:20px;
}

button{
font-size:20px;
padding:15px;
border:none;
border-radius:10px;
cursor:pointer;
width:200px;
}

/* HARİTA */

.map{
display:grid;
grid-template-columns:repeat(10,100px);
gap:8px;
justify-content:center;
margin-top:25px;
}

.country{
background:#334155;
padding:12px;
border-radius:8px;
cursor:pointer;
font-size:13px;
}

.enemy{background:#ef4444;}
.player{background:#22c55e;}

#event{
margin-top:20px;
font-size:20px;
}

/* SEÇİM EKRANI */

#electionScreen{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000000dd;
padding-top:120px;
}

.chart{
display:flex;
justify-content:center;
gap:60px;
margin-top:40px;
}

.bar{
width:90px;
height:0px;
border-radius:10px;
transition:1s;
}

.reform{background:#3b82f6;}
.halk{background:#22c55e;}
.guc{background:#ef4444;}

/* EKONOMİ GRAFİĞİ */

canvas{
background:#1e293b;
border-radius:10px;
margin-top:20px;
}

</style>

</head>

<body>

<h1>🌍 DevletSim World</h1>

<div id="stats"></div>

<div class="controls">

<button onclick="factory()">🏭 Fabrika</button>
<button onclick="school()">🏫 Okul</button>
<button onclick="armyUp()">🪖 Ordu</button>

<button onclick="nature()">🌱 Çevre</button>
<button onclick="taxUp()">💰 Vergi +</button>
<button onclick="taxDown()">💵 Vergi -</button>

<button onclick="city()">🏙 Şehir</button>
<button onclick="space()">🚀 Uzay</button>
<button onclick="save()">💾 Kaydet</button>

<button onclick="load()">📂 Yükle</button>

</div>

<h2>🗺 Dünya Haritası</h2>

<div class="map" id="map"></div>

<h3 id="event"></h3>

<h2>📊 Ekonomi Grafiği</h2>
<canvas id="ecoChart" width="600" height="250"></canvas>

<!-- SEÇİM -->

<div id="electionScreen">

<h1>🗳 Seçim Sonuçları</h1>

<div class="chart">

<div>
<div id="reformBar" class="bar reform"></div>
<p>Reform Partisi</p>
</div>

<div>
<div id="halkBar" class="bar halk"></div>
<p>Halk Partisi</p>
</div>

<div>
<div id="gucBar" class="bar guc"></div>
<p>Güç Partisi</p>
</div>

</div>

<h2 id="voteText"></h2>

<button onclick="closeElection()">Devam</button>

</div>

<script>

let para=200
let mutluluk=70
let ordu=80
let nufus=1000000
let vergi=10
let tur=1
let toprak=1

let ecoHistory=[para]

let countries=["ABD","Fransa","Almanya","İtalya","İspanya","İngiltere","Rusya","Çin","Japonya","Kore",
"Hindistan","Pakistan","İran","Irak","Suriye","Yunanistan","Brezilya","Arjantin","Meksika","Kanada",
"Norveç","İsveç","Finlandiya","Polonya","Ukrayna","Romanya","Bulgaristan","Sırbistan","Macaristan","Avusturya",
"Hollanda","Belçika","İsviçre","Portekiz","Fas","Cezayir","Mısır","Suudi","BAE","Katar",
"Endonezya","Tayland","Vietnam","Malezya","Filipinler","Avustralya","Yeni Zelanda","G.Afrika","Nijerya","Kenya"]

let enemyArmy=[]
let conquered=[]

for(let i=0;i<countries.length;i++){
enemyArmy.push(40+Math.random()*80)
conquered.push(false)
}

function createMap(){

let map=document.getElementById("map")

countries.forEach((c,i)=>{

let div=document.createElement("div")
div.className="country enemy"
div.id="c"+i
div.innerHTML="🏳 "+c
div.onclick=()=>attack(i)

map.appendChild(div)

})

}

function goster(){

document.getElementById("stats").innerHTML=

"Tur: "+tur+"<br>"+
"💰 Para: "+para+"<br>"+
"😊 Mutluluk: "+mutluluk+"<br>"+
"🪖 Ordu: "+ordu+"<br>"+
"👥 Nüfus: "+nufus+"<br>"+
"🌍 Toprak: "+toprak

}

function event(t){
document.getElementById("event").innerHTML=t
}

function drawGraph(){

let c=document.getElementById("ecoChart")
let ctx=c.getContext("2d")

ctx.clearRect(0,0,600,250)

ctx.beginPath()

ecoHistory.forEach((v,i)=>{

let x=i*30
let y=250-v

if(i==0){ctx.moveTo(x,y)}
else{ctx.lineTo(x,y)}

})

ctx.strokeStyle="lime"
ctx.stroke()

}

function election(){

let reform=Math.floor(Math.random()*40)+mutluluk/2
let halk=Math.floor(Math.random()*40)
let guc=Math.floor(Math.random()*40)

document.getElementById("electionScreen").style.display="block"

document.getElementById("reformBar").style.height=reform*3+"px"
document.getElementById("halkBar").style.height=halk*3+"px"
document.getElementById("gucBar").style.height=guc*3+"px"

document.getElementById("voteText").innerHTML=
"Reform:"+reform+" Halk:"+halk+" Güç:"+guc

}

function closeElection(){
document.getElementById("electionScreen").style.display="none"
}

function nextTurn(){

tur++

para+=Math.floor(nufus/100000)*vergi

ecoHistory.push(para)

drawGraph()

if(tur%5==0){
election()
}

goster()

}

function attack(i){

if(conquered[i]) return

if(ordu>enemyArmy[i]){

event(countries[i]+" fethedildi")

toprak++
para+=50
ordu-=10

conquered[i]=true

let d=document.getElementById("c"+i)
d.innerHTML="🇹🇷 Türkiye"
d.classList.remove("enemy")
d.classList.add("player")

}else{

event("Savaş kaybedildi")
ordu-=15
mutluluk-=10

}

goster()

}

function factory(){para+=40;nextTurn()}
function school(){para-=20;mutluluk+=10;nextTurn()}
function armyUp(){para-=30;ordu+=25;nextTurn()}
function nature(){para-=20;mutluluk+=5;nextTurn()}

function taxUp(){vergi+=2;mutluluk-=5;goster()}
function taxDown(){vergi-=2;mutluluk+=5;goster()}

function city(){para-=80;nufus+=120000;nextTurn()}
function space(){para-=120;nextTurn()}

function save(){

localStorage.setItem("devletsim",JSON.stringify({
para,mutluluk,ordu,nufus,vergi,tur,toprak
}))

}

function load(){

let d=JSON.parse(localStorage.getItem("devletsim"))

if(d){
para=d.para
mutluluk=d.mutluluk
ordu=d.ordu
nufus=d.nufus
vergi=d.vergi
tur=d.tur
toprak=d.toprak
}

goster()

}

createMap()
goster()
drawGraph()

</script>

</body>
</html>
