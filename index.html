<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DevletSim World</title>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
}

h1{
font-size:45px;
}

#stats{
background:#1e293b;
padding:20px;
width:350px;
margin:20px auto;
border-radius:10px;
font-size:20px;
}

button{
font-size:18px;
padding:12px;
margin:5px;
border:none;
border-radius:8px;
cursor:pointer;
width:170px;
}

button:hover{
transform:scale(1.05);
}

.map{
display:grid;
grid-template-columns:repeat(10,100px);
gap:8px;
justify-content:center;
margin-top:25px;
}

.country{
background:#334155;
padding:12px;
border-radius:8px;
cursor:pointer;
font-size:13px;
}

.enemy{
background:#ef4444;
}

.player{
background:#22c55e;
}

#event{
margin-top:20px;
font-size:20px;
}

/* seçim ekranı */

#electionScreen{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000000dd;
color:white;
text-align:center;
padding-top:120px;
}

.chart{
display:flex;
justify-content:center;
gap:120px;
margin-top:50px;
}

.barBox{
display:flex;
flex-direction:column;
align-items:center;
}

.bar{
width:90px;
height:0px;
border-radius:10px;
transition:1s;
}

.playerBar{
background:#22c55e;
}

.enemyBar{
background:#ef4444;
}

</style>

</head>

<body>

<h1>🌍 DevletSim World</h1>

<div id="stats"></div>

<button onclick="factory()">🏭 Fabrika</button>
<button onclick="school()">🏫 Okul</button>
<button onclick="armyUp()">🪖 Ordu</button>
<button onclick="nature()">🌱 Çevre</button>
<button onclick="taxUp()">💰 Vergi +</button>
<button onclick="taxDown()">💵 Vergi -</button>
<button onclick="city()">🏙 Şehir</button>
<button onclick="space()">🚀 Uzay</button>
<button onclick="save()">💾 Kaydet</button>
<button onclick="load()">📂 Yükle</button>

<h2>🗺 Dünya Haritası</h2>

<div class="map" id="map"></div>

<h3 id="event"></h3>

<!-- seçim ekranı -->

<div id="electionScreen">

<h1>🗳 Seçim Sonuçları</h1>

<div class="chart">

<div class="barBox">
<div id="playerBar" class="bar playerBar"></div>
<p>Sen</p>
</div>

<div class="barBox">
<div id="enemyBar" class="bar enemyBar"></div>
<p>Rakip</p>
</div>

</div>

<h2 id="voteText"></h2>

<button onclick="closeElection()">Devam</button>

</div>

<script>

let para=200
let mutluluk=70
let ordu=80
let nufus=1000000
let vergi=10
let sehir=1
let uzay=0
let tur=1
let toprak=1
let electionWin=true

let countries=[
"ABD","Fransa","Almanya","İtalya","İspanya","İngiltere","Rusya","Çin","Japonya","Kore",
"Hindistan","Pakistan","İran","Irak","Suriye","Yunanistan","Brezilya","Arjantin","Meksika","Kanada",
"Norveç","İsveç","Finlandiya","Polonya","Ukrayna","Romanya","Bulgaristan","Sırbistan","Macaristan","Avusturya",
"Hollanda","Belçika","İsviçre","Portekiz","Fas","Cezayir","Mısır","Suudi","BAE","Katar",
"Endonezya","Tayland","Vietnam","Malezya","Filipinler","Avustralya","Yeni Zelanda","G.Afrika","Nijerya","Kenya"
]

let enemyArmy=[]
let conquered=[]

for(let i=0;i<countries.length;i++){
enemyArmy.push(40+Math.floor(Math.random()*80))
conquered.push(false)
}

function createMap(){

let map=document.getElementById("map")

for(let i=0;i<countries.length;i++){

let div=document.createElement("div")

div.className="country enemy"
div.id="c"+i

div.innerHTML="🏳 "+countries[i]

div.onclick=function(){attack(i)}

map.appendChild(div)

}

}

function goster(){

document.getElementById("stats").innerHTML=

"Tur: "+tur+"<br>"+
"💰 Para: "+para+"<br>"+
"😊 Mutluluk: "+mutluluk+"<br>"+
"🪖 Ordu: "+ordu+"<br>"+
"👥 Nüfus: "+nufus+"<br>"+
"🌍 Toprak: "+toprak

}

function event(text){
document.getElementById("event").innerHTML=text
}

function newsSystem(){

let r=Math.floor(Math.random()*100)

if(r<40){

let a=Math.floor(Math.random()*countries.length)
let b=Math.floor(Math.random()*countries.length)

if(a!=b){

event("📰 SON DAKİKA: "+countries[a]+" ile "+countries[b]+" arasında savaş çıktı!")

}

}

}

function aiAttack(){

let r=Math.floor(Math.random()*100)

if(r<30){

let enemy=Math.floor(Math.random()*countries.length)

if(!conquered[enemy]){

if(enemyArmy[enemy]>ordu){

event("⚔️ "+countries[enemy]+" sana saldırdı!")

mutluluk-=10
para-=30
ordu-=10

}else{

event("🛡 "+countries[enemy]+" saldırdı ama savundun!")

ordu-=5

}

}

}

}

function election(){

let oy=mutluluk+Math.floor(Math.random()*20)
let rakip=100-oy

document.getElementById("electionScreen").style.display="block"

document.getElementById("playerBar").style.height=oy*3+"px"
document.getElementById("enemyBar").style.height=rakip*3+"px"

document.getElementById("voteText").innerHTML="Sen %"+oy+" | Rakip %"+rakip

if(oy>=rakip){
electionWin=true
}else{
electionWin=false
}

}

function closeElection(){

document.getElementById("electionScreen").style.display="none"

if(!electionWin){
alert("Seçimi kaybettin!")
location.reload()
}

}

function nextTurn(){

tur++

para+=Math.floor(nufus/100000)*vergi

aiAttack()
newsSystem()

if(tur%5==0){
election()
}

goster()

}

function attack(i){

if(conquered[i]){
event("Bu ülkeyi zaten fethettin")
return
}

if(ordu>enemyArmy[i]){

event("⚔️ "+countries[i]+" fethedildi!")

toprak++
para+=50
ordu-=10

conquered[i]=true

let country=document.getElementById("c"+i)

country.innerHTML="🇹🇷 Türkiye"
country.classList.remove("enemy")
country.classList.add("player")

}else{

event("⚔️ "+countries[i]+" savaşını kaybettin!")

ordu-=15
mutluluk-=10

}

goster()

}

function factory(){para+=40;mutluluk+=2;nextTurn()}
function school(){para-=20;mutluluk+=10;nextTurn()}
function armyUp(){para-=30;ordu+=25;nextTurn()}
function nature(){para-=20;mutluluk+=5;nextTurn()}

function taxUp(){vergi+=2;mutluluk-=5;goster()}
function taxDown(){vergi-=2;mutluluk+=5;goster()}

function city(){

if(para>=80){
para-=80
sehir++
nufus+=120000
event("Yeni şehir kuruldu!")
}else{
event("Yeterli para yok")
}

goster()

}

function space(){

if(para>=120){
para-=120
uzay++
event("Uzay programı ilerledi!")
}else{
event("Para yetmiyor")
}

goster()

}

function save(){

localStorage.setItem("devletsim",JSON.stringify({
para,mutluluk,ordu,nufus,vergi,sehir,uzay,tur,toprak
}))

event("Oyun kaydedildi")

}

function load(){

let data=JSON.parse(localStorage.getItem("devletsim"))

if(data){

para=data.para
mutluluk=data.mutluluk
ordu=data.ordu
nufus=data.nufus
vergi=data.vergi
sehir=data.sehir
uzay=data.uzay
tur=data.tur
toprak=data.toprak

event("Oyun yüklendi")

}

goster()

}

createMap()
goster()

</script>

</body>
</html>
