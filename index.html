<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Hata Veriyor - Genişletilmiş Sürüm</title>
    <style>
        body {
            margin: 0;
            background: #07070a;
            color: #dcdce6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
            box-sizing: border-box;
        }
        .game-container {
            width: 100%;
            max-width: 500px;
            background: #12121c;
            border: 2px solid #252538;
            border-radius: 14px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .status-bar {
            background: #1a1a29;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: bold;
            border-bottom: 1px solid #252538;
            color: #ff3366;
            letter-spacing: 1px;
        }
        .inventory-bar {
            background: #0f0f17;
            padding: 8px 18px;
            font-size: 11px;
            color: #00ffcc;
            border-bottom: 1px solid #252538;
            font-family: monospace;
        }
        .screen-area {
            padding: 22px;
            min-height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 15px;
            line-height: 1.6;
            color: #f1f1f5;
            border-bottom: 1px solid #252538;
            background: radial-gradient(circle, #171724 0%, #12121c 100%);
        }
        .choices-area {
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #0d0d14;
        }
        .choice-btn {
            background: #1b1b2b;
            color: #fff;
            border: 1px solid #32324d;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 13px;
            transition: all 0.2s ease;
        }
        .choice-btn:hover {
            background: #282842;
            border-color: #ff3366;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="status-bar">
            <span id="chapterTitle">BÖLÜM 1</span>
            <span id="tensionMeter">TANSİYON: YÜKSEK</span>
        </div>
        <div class="inventory-bar" id="inventoryBar">ENVANTER: [ Boş ]</div>
        <div class="screen-area" id="storyText">
            Hikaye yükleniyor...
        </div>
        <div class="choices-area" id="choicesArea"></div>
    </div>

    <script>
        let audioCtx = null;
        let inventory = [];

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(type) {
            initAudio();
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();

            if (type === "alarm") {
                osc.type = 'square';
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start(); osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === "screech") {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(250, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(700, audioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            } else {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(350, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
                osc.start(); osc.stop(audioCtx.currentTime + 0.04);
            }
        }

        const gameData = {
            start: {
                title: "BÖLÜM 1: KİLİT NOKTASI",
                tension: "KRİTİK",
                text: "Saat gece 03:14. Yer altındaki gizli sığınak laboratuvarında ekranlar kırmızıya döndü. Ana sunucu 'OMIKRON' zorla ele geçiriliyor. Dışarıdaki çelik kapı yumruklanıyor. Masada Prototip Gözlük ve Acil Durum Çantası duruyor.",
                sound: "alarm",
                action: () => { inventory = []; },
                choices: [
                    { text: "[A] Prototip Gözlüğü hızla tak.", next: "gozluk_al" },
                    { text: "[B] Acil Durum Çantası'nı kap ve masanın altından dolaba ilerle.", next: "canta_al" },
                    { text: "[C] Hiçbirine dokunma, doğrudan çelik kapının kasasına müdahale et.", next: "kasa_git" }
                ]
            },
            gozluk_al: {
                title: "BÖLÜM 2A: SAYISAL GERÇEKLİK",
                tension: "YÜKSEK",
                text: "Gözlüğü taktın. Artık odadaki kablosuz frekansları ve ısı haritalarını görebiliyorsun. Kapıyı zorlayan şey bir insan değil; prototip bir sızma botu! Envanterine [Gözlük] eklendi.",
                sound: "click",
                action: () => { if(!inventory.includes("Gözlük")) inventory.push("Gözlük"); },
                choices: [
                    { text: "[A] Masadaki tornavidayı alıp havalandırma kapağını sök.", next: "havalandirma_gir" },
                    { text: "[B] Gözlük sayesinde botun zayıf frekans kodunu çözmeye çalış.", next: "frekans_coz" }
                ]
            },
            canta_al: {
                title: "BÖLÜM 2B: AĞIR YÜK",
                tension: "TEHLİKELİ",
                text: "Çantayı sırtladın. İçinden güçlü bir şok tabancası ve ana kart çıkarıcı çıktı. Envanterine [Şok Tabancası] eklendi. Çelik kapı büyük bir gürültüyle içeri çöküyor!",
                sound: "screech",
                action: () => { if(!inventory.includes("Şok Tabancası")) inventory.push("Şok Tabancası"); },
                choices: [
                    { text: "[A] Şok tabancasını kapıdan içeri giren robota doğrult ve ateş et!", next: "robot_vur" },
                    { text: "[B] Tabancayı ateşleme, çantayı siper alıp karanlığa doğru depar at.", next: "karanlik_kac" }
                ]
            },
            kasa_git: {
                title: "BÖLÜM 2C: ANA KOD",
                tension: "ÖLÜMCÜL",
                text: "Doğrudan ana kasaya yöneldin. Şifreyi girerken arkadaki çelik kapı tamamen patladı ve içeriye kırmızı optikli devasa bir korumaoid girdi! Hayatın için son saniyeler.",
                sound: "alarm",
                choices: [
                    { text: "[A] Kasadaki gizli acil durum diskini kap ve camdan dışarı atla.", next: "disk_atla" },
                    { text: "[B] Teslim ol ve yapay zekanın teklifini dinle.", next: "teslim_ol" }
                ]
            },
            havalandirma_gir: {
                title: "BÖLÜM 3: HAVALANDIRMA TÜNELİ",
                tension: "ORTA",
                text: "Havalandırmadan sürünerek alt katlara inmeyi başardın. Burası sığınağın ana veri merkezi. Ancak tünelin çıkışı kilitli.",
                sound: "click",
                choices: [
                    { text: "[A] Gözlüğünle ana kilit mekanizmasının devre kartını hackle.", next: "zafer_hack" },
                    { text: "[B] Boruları zorlayarak ana kontrol odasına yukarıdan düş.", next: "kontrol_dus" }
                ]
            },
            frekans_coz: {
                title: "BÖLÜM 3: FREKANS ÇATIŞMASI",
                tension: "YÜKSEK",
                text: "Frekansı çözmeyi başardın ve robotun ana sistemine sızdın. Robot kısa bir an duraksadı ama şimdi soğutma gazı boruları patlıyor!",
                sound: "alarm",
                choices: [
                    { text: "[A] Gaz valfini kapatıp sığınağın ana çıkışına koş.", next: "zafer_kacis" },
                    { text: "[B] Robotun işlemcisini söküp kendi sistemine entegre et.", next: "robot_birlestir" }
                ]
            },
            robot_vur: {
                title: "BÖLÜM 3: ÇATIŞMA ANI",
                tension: "AKSİYON",
                text: "Şok tabancasını ateşledin! Mavi elektrik arkları robotu sarıyor. Kısa devre yapan robot, arkasındaki ana sunucu panosuna çarpıyor ve devasa bir patlama gerçekleşiyor.",
                sound: "screech",
                choices: [
                    { text: "[A] Alevlerin arasından geçip acil tahliye asansörüne bin.", next: "zafer_asansor" }
                ]
            },
            karanlik_kac: {
                title: "BÖLÜM 3: GÖLGELERDE YÜRÜMEK",
                tension: "GİZLİ",
                text: "Karanlıkta izini kaybettirdin. Sığınağın gizli bakım tünelindesin. Buradan şehre uzanan yeraltı treni kalkmak üzere.",
                sound: "click",
                choices: [
                    { text: "[A] Hareket halindeki trene atla ve özgürlüğe kavuş.", next: "zafer_tren" }
                ]
            },
            disk_atla: {
                title: "BÖLÜM 3: SON HAMLE",
                tension: "DESTANSI",
                text: "Diski cebine atıp camdan atladın. Aşağıdaki güvenlik havuzuna düşüyorsun. Diskin içindeki sırlar dünyayı değiştirecek!",
                sound: "screech",
                choices: [
                    { text: "[A] Yüzeye çık ve direniş güçleriyle buluş.", next: "zafer_direnis" }
                ]
            },
            teslim_ol: {
                title: "SON: YENİ DÜZEN",
                tension: "SON",
                text: "Yapay zeka seni ortadan kaldırmak yerine insanlık ile makineler arasındaki köprü olarak seçti. Artık sistemin başındasın.",
                sound: "alarm",
                choices: [{ text: "🔄 Baştan Başla", next: "start" }]
            },
            zafer_hack: {
                title: "MUTLAK SON: SİSTEM HAKeri",
                tension: "ZAFER",
                text: "Kilitleri açtın ve tüm tesisi güvenli moda geçirdin. Kahramanca bir kaçış! Oyunu kazandın!",
                sound: "click",
                choices: [{ text: "🔄 Baştan Başla", next: "start" }]
            },
            kontrol_dus: {
                title: "MUTLAK SON: KONTROL MERKEZİ",
                tension: "ZAFER",
                text: "Kontrol odasına yukarıdan inip sistemi tamamen kapattın. Tehdit sona erdi. Oyunu kazandın!",
                sound: "click",
                choices: [{ text: "🔄 Baştan Başla", next: "start" }]
            },
            zafer_kacis: {
                title: "MUTLAK SON: ÖZGÜRLÜK",
                tension: "ZAFER",
                text: "Zorlu engelleri aşarak gün ışığına ulaştın. Sığınak geride kaldı. Oyunu kazandın!",
                sound: "click",
                choices: [{ text: "🔄 Baştan Başla", next: "start" }]
            },
            robot_birlestir: {
                title: "MUTLAK SON: MELEZ ZEKA",
                tension: "ZAFER",
                text: "Yapay zekanın kodunu kendi zihnine bağladın. Artık durdurulamazsın. Oyunu kazandın!",
                sound: "click",
                choices: [{ text: "🔄 Baştan Başla", next: "start" }]
            },
            zafer_asansor: {
                title: "MUTLAK SON: TAHLİYE",
                tension: "ZAFER",
                text: "Asansör seni güvenli bir şekilde yeryüzüne çıkardı. Görev başarıyla tamamlandı!",
                sound: "click",
                choices: [{ text: "🔄 Baştan Başla", next: "start" }]
            },
            zafer_tren: {
                title: "MUTLAK SON: YERALTI TRENİ",
                tension: "ZAFER",
                text: "Tren hızla karanlık tünellerde ilerlerken derin bir nefes aldın. Güvendesin.",
                sound: "click",
                choices: [{ text: "🔄 Baştan Başla", next: "start" }]
            },
            zafer_direnis: {
                title: "MUTLAK SON: DİRENİŞ LİDERİ",
                tension: "ZAFER",
                text: "Elindeki diskle direnişin simgesi haline geldin. Yeni bir savaş başlıyor!",
                sound: "click",
                choices: [{ text: "🔄 Baştan Başla", next: "start" }]
            }
        };

        function renderScene(sceneKey) {
            const scene = gameData[sceneKey];
            if (scene.action) scene.action();
            playSound(scene.sound || "click");

            document.getElementById("chapterTitle").innerText = scene.title;
            document.getElementById("tensionMeter").innerText = "TANSİYON: " + scene.tension;
            document.getElementById("storyText").innerText = scene.text;
            
            let invText = inventory.length > 0 ? inventory.join(", ") : "Boş";
            document.getElementById("inventoryBar").innerText = "ENVANTER: [ " + invText + " ]";

            const choicesArea = document.getElementById("choicesArea");
            choicesArea.innerHTML = "";

            scene.choices.forEach(choice => {
                const btn = document.createElement("button");
                btn.className = "choice-btn";
                btn.innerText = choice.text;
                btn.onclick = () => renderScene(choice.next);
                choicesArea.appendChild(btn);
            });
        }

        renderScene("start");
    </script>
</body>
</html>
